<!DOCTYPE html>
<html>
<head>
    <title>Test</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }

        h1 {
            color: white;
            font-size: 32px;
            text-align: center;
            margin-bottom: 25px;
            text-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        input {
            width: 280px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        button {
            margin-top: 18px;
            padding: 13px 30px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #e66b7a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        button:hover {
            transform: scale(1.05);
        }
    </style> 
</head>

<body>

    <div>
        <h1>اسم خود را وارد کنید</h1>

        <input type="text" id="btn">

        <br>

        <button onclick="window.location.href='page2.html'">
            معنی اسمت
        </button>
    </div>

</body>
</html>
